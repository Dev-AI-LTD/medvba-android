<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="50%" style="stop-color:#0F2139"/>
      <stop offset="100%" style="stop-color:#023E8A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="45%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#00B4D8;stop-opacity:0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <ellipse cx="540" cy="720" rx="420" ry="420" fill="url(#glow)"/>
  <!-- Decorative particles -->
  <circle cx="180" cy="400" r="3" fill="#00B4D8" opacity="0.5"/>
  <circle cx="900" cy="520" r="2" fill="#48CAE4" opacity="0.6"/>
  <circle cx="820" cy="1100" r="4" fill="#00B4D8" opacity="0.4"/>
  <circle cx="240" cy="1300" r="2" fill="#48CAE4" opacity="0.5"/>
  <!-- Placeholder for logo: replace href with embedded PNG or paste icon in CapCut -->
  <circle cx="540" cy="680" r="140" fill="#0F2139" stroke="#00B4D8" stroke-width="3" opacity="0.9"/>
  <text x="540" y="690" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="28" fill="#48CAE4" opacity="0.8">[logo]</text>
  <text x="540" y="920" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" filter="url(#softGlow)">MEDVBA</text>
  <text x="540" y="1000" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="40" fill="#00B4D8">medvba.app</text>
  <text x="540" y="1080" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="32" fill="#A0B4C8">Disponibil pe Google Play</text>
  <text x="540" y="1160" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="28" fill="#5A7A96">Recomandai studenilor votri</text>
</svg>
