name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Expo ESLint — zero errors required)
        run: bun run lint

      - name: Typecheck (blocking)
        run: bunx tsc --noEmit

      - name: Unit / integration tests
        run: bun run test:ci

      - name: Expo doctor (blocking)
        run: bun run doctor
